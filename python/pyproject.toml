[project]
name = "akigumo-python"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "neo4j",
    "pydantic",
    "pydantic-settings",
    "redis",
    "structlog",
    "rarfile",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "infrastructure*",
    "graph_refinement*",
]