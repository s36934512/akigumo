<section class="flex min-w-0 flex-col gap-4">
    <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">名稱 *</span>
        <input
            pInputText
            class="w-full box-border"
            [ngModel]="conceptName()"
            (ngModelChange)="conceptName.set($event)"
            [disabled]="isPending()"
            placeholder="輸入 Concept 名稱"
        />
    </label>

    <label class="flex flex-col gap-1.5">
        <span class="text-sm font-medium">描述</span>
        <textarea
            class="w-full box-border"
            [ngModel]="conceptDescription()"
            (ngModelChange)="conceptDescription.set($event)"
            [disabled]="isPending()"
            placeholder="輸入 Concept 描述（選填）"
            rows="3"
        ></textarea>
    </label>

    <footer
        class="grid grid-cols-[1fr_auto] items-center gap-4 border-t pt-3 max-[30rem]:grid-cols-1"
    >
        <div class="flex items-center justify-end gap-2 max-[30rem]:justify-end">
            <p-button
                label="取消"
                severity="secondary"
                [outlined]="true"
                [disabled]="isPending()"
                (onClick)="onCancel()"
            />

            <p-button
                [label]="isPending() ? '儲存中…' : '儲存'"
                [disabled]="!canSubmit()"
                (onClick)="submit()"
            />
        </div>
    </footer>
</section>
