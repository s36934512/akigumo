<div>
    <input
        type="text"
        [value]="queryText()"
        (input)="queryText.set($any($event.target).value)"
        placeholder="搜尋..."
    />

    <select [value]="searchType()" (change)="searchType.set($any($event.target).value)">
        <option value="archive">Archive</option>
        <option value="concept">Concept</option>
    </select>
</div>

@if (searchQuery.isPending()) {
    <p>搜尋中...</p>
} @else if (searchQuery.isError()) {
    <p>搜尋失敗</p>
} @else {
    @for (item of searchQuery.data()?.resultList ?? []; track item.id) {
        <div>
            <h3>{{ item.name }}</h3>

            @if (item.entityType === "archive") {
                <p>{{ item.type }}</p>
            } @else {
                <p>Concept</p>
            }
        </div>
    } @empty {
        <p>找不到符合的結果</p>
    }
}
