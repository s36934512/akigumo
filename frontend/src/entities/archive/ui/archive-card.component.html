<ng-template #previewContent>
    <div
        class="flex max-w-[calc(100vw-2rem)] flex-col overflow-hidden bg-white"
        (click)="onClick()"
        (dblclick)="onDoubleClick()"
    >
        <div class="border-b border-gray-200 px-3 py-2">
            <p class="m-0 truncate text-sm font-semibold text-gray-900">
                {{ archive().name }}
            </p>
        </div>

        @if (previewUrl(); as url) {
            <img
                class="block max-w-full object-contain"
                [src]="url"
                [alt]="archive().name"
                [style.width.px]="previewSize()?.width ?? null"
                [style.height.px]="previewSize()?.height ?? null"
                (load)="onPreviewImageLoad($event)"
                (error)="onPreviewImageError()"
            />
        } @else {
            <div class="p-4 text-sm text-gray-500">無法預覽此檔案</div>
        }
    </div>
</ng-template>

<article
    class="w-full min-w-0 px-3 pb-4 pt-3 text-zinc-100"
    (click)="onClick()"
    sharedOverlayPanelDirective
    [sharedOverlayPanel]="previewContent"
>
    <div
        class="archive-card__frame relative aspect-[3/4] w-full overflow-hidden rounded-[0.3rem] border-4"
        [class.archive-card__frame--selected]="selected()"
    >
        <div class="archive-card__surface h-full w-full overflow-hidden">
            @if (coverUrl(); as url) {
                <img
                    class="archive-card__cover absolute inset-0 z-[1] h-full w-full object-contain"
                    [src]="url"
                    [alt]="archive().name"
                    loading="lazy"
                    decoding="async"
                    (error)="onImageError()"
                />
            } @else {
                <div
                    class="archive-card__placeholder absolute inset-0 z-[2] grid place-items-center"
                    aria-hidden="true"
                >
                    <svg
                        class="archive-card__placeholder-icon size-[5.25rem]"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path [attr.d]="iconPath()" />
                    </svg>
                </div>
            }

            @if (selected()) {
                <div
                    class="archive-card__selected-indicator absolute right-2 top-2 z-[6] grid size-7 place-items-center rounded-full border"
                    aria-label="已選取"
                >
                    <svg
                        class="size-4"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="3"
                        aria-hidden="true"
                    >
                        <path d="m5 12 4 4L19 6" />
                    </svg>
                </div>
            }
        </div>
    </div>
</article>
