<section class="flex h-full min-h-0 w-full min-w-0 flex-col bg-[#f7f9fc]">
    <header class="flex shrink-0 items-center justify-between gap-4 border-b border-[#e2e8f0] p-4">
        <h2 class="m-0 min-w-0 truncate text-base font-semibold">
            {{ archive().name }}
        </h2>

        <p-button
            icon="pi pi-times"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            ariaLabel="關閉詳細資訊"
            title="關閉"
            (onClick)="onClose()"
        />
    </header>

    <div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden">
        <feature-archive-info class="block min-h-0 min-w-0 flex-1" [archive]="archive()" />

        <div
            class="flex shrink-0 items-center justify-between gap-2 border-t border-[#e2e8f0] px-4 py-4"
        >
            <div class="flex min-w-0 flex-wrap gap-2">
                <p-button
                    label="新增 Concept"
                    icon="pi pi-plus"
                    severity="secondary"
                    [outlined]="true"
                    (onClick)="onAddConcept()"
                />

                <p-button
                    label="新增 Concept Pair"
                    icon="pi pi-plus"
                    severity="secondary"
                    [outlined]="true"
                    (onClick)="onAddConceptPair()"
                />
            </div>

            <p-button
                label="刪除"
                icon="pi pi-trash"
                severity="danger"
                [outlined]="true"
                (onClick)="onDelete()"
            />
        </div>
    </div>
</section>
