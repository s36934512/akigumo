<section class="flex h-full min-h-0 w-full min-w-0 flex-col">
    <header class="archive-detail__header flex shrink-0 items-center gap-3 border-b px-4 py-3">
        <button
            type="button"
            class="archive-detail__icon-button inline-flex size-9 shrink-0 items-center justify-center rounded-lg"
            aria-label="返回"
            title="返回"
            (click)="onBack()"
        >
            <span class="material-symbols-outlined" aria-hidden="true"> arrow_back </span>
        </button>

        <div class="min-w-0 flex-1">
            <h1 class="m-0 truncate text-lg font-semibold">
                {{ archive().name }}
            </h1>

            <p class="archive-detail__subtitle m-0 mt-1 text-xs">
                {{ archive().type }}
            </p>
        </div>
    </header>

    <nav
        class="archive-detail__tabs flex shrink-0 items-center gap-1 border-b px-4"
        aria-label="Archive 詳細資訊"
    >
        <button
            type="button"
            class="archive-detail__tab px-3 py-3 text-sm font-medium"
            [class.archive-detail__tab--active]="activeSection() === 'info'"
            [attr.aria-current]="activeSection() === 'info' ? 'page' : null"
            (click)="setSection('info')"
        >
            基本資訊
        </button>

        <button
            type="button"
            class="archive-detail__tab px-3 py-3 text-sm font-medium"
            [class.archive-detail__tab--active]="activeSection() === 'content'"
            [attr.aria-current]="activeSection() === 'content' ? 'page' : null"
            (click)="setSection('content')"
        >
            檔案內容
        </button>
    </nav>

    <div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden">
        @if (activeSection() === "info") {
            <feature-archive-info
                class="block min-h-0 min-w-0 flex-1 overflow-hidden"
                [archive]="archive()"
            />
        } @else {
            <section
                class="flex min-h-0 min-w-0 flex-1 flex-col overflow-auto p-4"
                aria-label="檔案內容"
            >
                @if (archive().currentFileId && !imageError()) {
                    <div
                        class="archive-detail__preview flex min-h-0 min-w-0 flex-1 items-center justify-center overflow-auto rounded-xl p-3"
                    >
                        <img
                            class="max-h-full max-w-full object-contain"
                            [src]="'/api/v1/raw/' + archive().currentFileId"
                            [alt]="archive().name"
                            (error)="onImageError()"
                        />
                    </div>
                } @else {
                    <div
                        class="archive-detail__empty flex min-h-64 flex-1 flex-col items-center justify-center gap-3 rounded-xl border border-dashed p-6 text-center"
                    >
                        <span class="material-symbols-outlined text-4xl" aria-hidden="true">
                            draft
                        </span>

                        <p class="m-0 text-sm">
                            {{
                                archive().currentFileId
                                    ? "目前無法預覽此檔案"
                                    : "此 Archive 尚無檔案"
                            }}
                        </p>
                    </div>
                }
            </section>
        }
    </div>

    <footer
        class="archive-detail__footer flex shrink-0 flex-wrap items-center gap-2 border-t px-4 py-3"
    >
        <button
            type="button"
            class="archive-detail__action inline-flex items-center justify-center gap-1.5 rounded-lg border px-3 py-2 text-sm"
            (click)="onAddConcept()"
        >
            <span class="material-symbols-outlined" aria-hidden="true"> add </span>
            新增 Concept
        </button>

        <button
            type="button"
            class="archive-detail__action inline-flex items-center justify-center gap-1.5 rounded-lg border px-3 py-2 text-sm"
            (click)="onAddConceptPair()"
        >
            <span class="material-symbols-outlined" aria-hidden="true"> add </span>
            新增 Concept Pair
        </button>
    </footer>
</section>
