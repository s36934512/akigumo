<div class="relative h-full min-h-0 w-full">
    <div #cyCanvas class="h-full w-full"></div>

    <div
        class="absolute right-4 top-4 z-10 flex flex-col overflow-hidden rounded border bg-white/90 shadow"
    >
        <button type="button" (click)="zoomIn()" title="放大">+</button>

        <button type="button" (click)="zoomOut()" title="縮小">−</button>

        <button type="button" (click)="fitGraph()" title="適應視窗">適應</button>

        <button type="button" (click)="resetGraph()" title="重設">重設</button>
    </div>
</div>
