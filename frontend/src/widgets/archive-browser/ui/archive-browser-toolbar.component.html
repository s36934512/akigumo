<header class="flex w-full min-w-0 flex-wrap items-center gap-3">
    <!-- Search -->
    <p-iconfield class="min-w-0 flex-1" iconPosition="left">
        <p-inputicon class="pi pi-search" />

        <input
            pInputText
            type="search"
            class="w-full"
            placeholder="搜尋 Archive..."
            [value]="searchQuery()"
            (input)="searchQueryChange.emit($any($event.target).value)"
        />
    </p-iconfield>

    <!-- Grid column count -->
    <div class="flex shrink-0 items-center gap-2">
        <p-button
            icon="pi pi-minus"
            severity="secondary"
            [outlined]="true"
            [disabled]="!canDecreaseColumnCount()"
            ariaLabel="減少網格欄數"
            (onClick)="decreaseColumnCount.emit()"
        />

        <span class="min-w-12 text-center text-sm tabular-nums"> {{ columnCount() }} 欄 </span>

        <p-button
            icon="pi pi-plus"
            severity="secondary"
            [outlined]="true"
            [disabled]="!canIncreaseColumnCount()"
            ariaLabel="增加網格欄數"
            (onClick)="increaseColumnCount.emit()"
        />
    </div>

    <!-- Sort direction -->
    <p-button
        [icon]="sortDirection() === 'desc' ? 'pi pi-sort-amount-down' : 'pi pi-sort-amount-up'"
        [label]="sortDirection() === 'desc' ? '降冪' : '升冪'"
        severity="secondary"
        [outlined]="true"
        [ariaLabel]="
            sortDirection() === 'desc' ? '目前降冪排序，切換為升冪' : '目前升冪排序，切換為降冪'
        "
        (onClick)="toggleSortDirection()"
    />
</header>
