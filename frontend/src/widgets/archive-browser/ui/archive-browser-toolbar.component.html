<header class="flex w-full min-w-0 flex-wrap items-center gap-3">
    <!-- Search -->
    <p-iconfield class="min-w-0 flex-1" iconPosition="left">
        <p-inputicon class="pi pi-search" />

        <input
            pInputText
            type="search"
            class="w-full"
            placeholder="搜尋 Archive..."
            [value]="searchQuery()"
            (input)="searchQueryChange.emit($any($event.target).value)"
        />
    </p-iconfield>

    <!-- Grid Layout -->
    <feature-archive-grid-layout
        [columnCount]="columnCount()"
        [canDecrease]="canDecreaseColumnCount()"
        [canIncrease]="canIncreaseColumnCount()"
        (decrease)="decreaseColumnCount.emit()"
        (increase)="increaseColumnCount.emit()"
    />

    <!-- Sort direction -->
    <p-button
        [icon]="sortDirection() === 'desc' ? 'pi pi-sort-amount-down' : 'pi pi-sort-amount-up'"
        [label]="sortDirection() === 'desc' ? '降冪' : '升冪'"
        severity="secondary"
        [outlined]="true"
        [ariaLabel]="
            sortDirection() === 'desc' ? '目前降冪排序，切換為升冪' : '目前升冪排序，切換為降冪'
        "
        (onClick)="toggleSortDirection()"
    />
</header>
